name: Build firmware

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi dfu-util

      - name: Build STM32F072 firmware
        run: ./scripts/build.sh

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: sh-c30g-stm32f072-pcan-firmware
          path: build/*
